name: Publish Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Validate release version and notes
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$releaseVersion") { throw 'Tag and package version must match.' }
          if (!(Test-Path "docs/releases/$releaseVersion.md")) { throw 'Release notes are required.' }
      - run: npm ci
      - run: npm test
      - name: Build installer
        run: npm run package -- --publish never
      - name: Publish installer and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installerName = "X SpeedUp Setup $releaseVersion.exe"
          $installerPath = Join-Path release $installerName
          $checksum = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $installerName" | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8
          gh release create $env:GITHUB_REF_NAME $installerPath release/SHA256SUMS.txt --verify-tag --title "X SpeedUp $releaseVersion" --notes-file "docs/releases/$releaseVersion.md"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
